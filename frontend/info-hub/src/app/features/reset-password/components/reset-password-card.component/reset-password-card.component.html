<p-toast />

<div class="rp-card">
  <h1 class="rp-card__title">{{ constants.title }}</h1>
  <p class="rp-card__subtitle">{{ constants.subtitle }}</p>

  <form novalidate (submit)="onSubmit($event)" class="rp-card__form">
    <!-- New Password -->
    <div class="rp-card__field">
      <p-password
        [(ngModel)]="newPassword"
        name="newPassword"
        [placeholder]="constants.newPasswordPlaceholder"
        [toggleMask]="true"
        [feedback]="false"
        styleClass="rp-card__input"
      />
      @for (error of passwordErrors; track error) {
        <p-message severity="error" size="small" variant="simple">
          {{ error }}
        </p-message>
      }
    </div>

    <!-- Confirm Password -->
    <div class="rp-card__field">
      <p-password
        [(ngModel)]="confirmPassword"
        name="confirmPassword"
        [placeholder]="constants.confirmPasswordPlaceholder"
        [toggleMask]="true"
        [feedback]="false"
        styleClass="rp-card__input"
      />
      @if (passwordMismatch) {
        <p-message severity="error" size="small" variant="simple">
          {{ constants.mismatchError }}
        </p-message>
      }
    </div>

    <button pButton type="submit" [disabled]="!isFormValid" class="rp-card__btn">
      {{ constants.submitBtn }}
    </button>

    <p class="rp-card__back">
      {{ constants.backText }} <a href="#">{{ constants.backLink }}</a>
    </p>
  </form>
</div>
