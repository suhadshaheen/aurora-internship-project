<p-toast />

<div class="fp-card">
  <h1 class="fp-card__title">{{ constants.title }}</h1>
  <p class="fp-card__subtitle">{{ constants.subtitle }}</p>

  <form novalidate (submit)="onSubmit($event)" class="fp-card__form">
    <div class="fp-card__field">
      <input
        pInputText
        type="email"
        [placeholder]="constants.emailPlaceholder"
        [formField]="forgotForm.email"
        class="fp-card__input"
        [class.fp-card__input--invalid]="forgotForm.email().dirty() && forgotForm.email().invalid()"
      />

      @if (forgotForm.email().dirty() && forgotForm.email().invalid()) {
        @for (error of forgotForm.email().errors(); track error.kind) {
          <p-message severity="error" size="small" variant="simple">
            {{ error.message }}
          </p-message>
        }
      }
    </div>
    <button
      pButton
      type="submit"
      class="fp-card__btn"
      [disabled]="!forgotForm.email().value() || forgotForm.email().invalid()"
    >
      {{ constants.submitBtn }}
    </button>

    <p class="fp-card__back">{{ constants.backText }} <a routerLink="/login">Sign In</a></p>
  </form>
</div>
