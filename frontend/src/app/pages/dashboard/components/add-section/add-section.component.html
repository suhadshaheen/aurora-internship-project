<button type="button" class="add-section-trigger" (click)="showDialog()">
  <span class="add-icon">
    <i class="pi pi-plus"></i>
  </span>

  <span class="add-text">Add Section</span>
</button>

<p-dialog
  header="Add New Section"
  [modal]="true"
  [(visible)]="visible"
  [style]="{ width: '45rem' }"
  styleClass="add-section-dialog"
>
  <div class="add-section-form">
    <div class="flex align-items-center gap-3 mb-3">
      <label for="title" class="font-semibold w-8rem">Title</label>

      <input
        pInputText
        id="title"
        name="title"
        class="flex-auto form-input"
        [(ngModel)]="title"
        autocomplete="off"
        placeholder="Section title"
      />
    </div>

    <div class="flex align-items-center gap-3 mb-3">
      <label for="catId" class="font-semibold w-8rem">Category</label>

      <input
        pInputText
        id="catId"
        name="catId"
        type="number"
        class="flex-auto form-input"
        [(ngModel)]="catId"
        autocomplete="off"
        placeholder="Category id"
      />
    </div>

    <div class="mb-3">
      <label class="font-semibold block mb-2">Content</label>

      <p-editor name="content" [(ngModel)]="content" [style]="{ height: '320px' }"> </p-editor>
    </div>

    <div class="flex align-items-center gap-3 mb-3">
      <label class="font-semibold w-8rem">Visibility</label>

      <div class="flex gap-2">
        <p-button
          label="Visible"
          [outlined]="!sectionVisibility"
          [severity]="sectionVisibility ? 'success' : 'secondary'"
          (onClick)="sectionVisibility = true"
        >
        </p-button>

        <p-button
          label="Hidden"
          [outlined]="sectionVisibility"
          [severity]="sectionVisibility ? 'secondary' : 'warn'"
          (onClick)="sectionVisibility = false"
        >
        </p-button>
      </div>
    </div>

    <div class="flex justify-content-end gap-2">
      <p-button
        label="Cancel"
        severity="secondary"
        styleClass="cancel-btn"
        (onClick)="closeDialog()"
      >
      </p-button>

      <p-button label="Add" styleClass="save-btn" (onClick)="addSection()"> </p-button>
    </div>
  </div>
</p-dialog>
