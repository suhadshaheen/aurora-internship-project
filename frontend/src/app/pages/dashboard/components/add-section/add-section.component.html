<button type="button" class="add-section-trigger" (click)="showDialog()">
  <span class="add-icon">
    <i class="pi pi-plus"></i>
  </span>

  <span class="add-text">Add Section</span>
</button>

<p-dialog
  header="Add New Section"
  [modal]="true"
  [(visible)]="visible"
  [style]="{ width: '45rem' }"
  styleClass="add-section-dialog"
>
  <div class="add-section-form">
    <div class="flex align-items-center gap-3 mb-3">
      <label for="title" class="font-semibold w-8rem">Title</label>

      <input
        pInputText
        id="title"
        name="title"
        class="flex-auto form-input"
        [(ngModel)]="title"
        autocomplete="off"
        placeholder="Section title"
      />
    </div>

    <div class="flex align-items-center gap-3 mb-3">
      <label for="catId" class="font-semibold w-8rem">Category</label>

      <input
        pInputText
        id="catId"
        name="catId"
        type="number"
        class="flex-auto form-input"
        [(ngModel)]="catId"
        autocomplete="off"
        placeholder="Category id"
      />
    </div>

    <div class="mb-3">
      <label class="font-semibold block mb-2">Content</label>

      <div #editorBounds>
        <p-editor
          name="content"
          [(ngModel)]="content"
          [style]="{ height: '320px' }"
          [bounds]="editorBounds"
          (onInit)="onEditorInit($event)"
        >
        </p-editor>
      </div>
    </div>

    <div class="mb-3">
      <label class="font-semibold block mb-2">Documents</label>

      <input
        #documentsInput
        type="file"
        accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,.ppt,.pptx"
        multiple
        hidden
        (change)="onDocumentsSelected($event)"
      />
      <p-button
        label="Choose Documents"
        icon="pi pi-file"
        severity="secondary"
        [outlined]="true"
        (onClick)="documentsInput.click()"
      >
      </p-button>

      <ul class="file-chip-list" *ngIf="documents.length">
        <li class="file-chip" *ngFor="let file of documents; let i = index">
          <span class="file-chip__name">{{ file.name }}</span>
          <button
            type="button"
            class="file-chip__remove"
            (click)="removeDocument(i)"
            aria-label="Remove document"
          >
            <i class="pi pi-times"></i>
          </button>
        </li>
      </ul>
    </div>

    <div class="flex align-items-center gap-3 mb-3">
      <label class="font-semibold w-8rem">Visibility</label>

      <div class="flex gap-2">
        <p-button
          label="Visible"
          [outlined]="!sectionVisibility"
          [severity]="sectionVisibility ? 'success' : 'secondary'"
          (onClick)="sectionVisibility = true"
        >
        </p-button>

        <p-button
          label="Hidden"
          [outlined]="sectionVisibility"
          [severity]="sectionVisibility ? 'secondary' : 'warn'"
          (onClick)="sectionVisibility = false"
        >
        </p-button>
      </div>
    </div>

    <div class="flex justify-content-end gap-2">
      <p-button
        label="Cancel"
        severity="secondary"
        styleClass="cancel-btn"
        (onClick)="closeDialog()"
      >
      </p-button>

      <p-button label="Add" styleClass="save-btn" (onClick)="addSection()"> </p-button>
    </div>
  </div>
</p-dialog>
