<div class="users-page">
  <p-confirmdialog />

  <div class="users-page__header">
    <h2>All Users</h2>
    <button type="button" class="add-user-trigger" (click)="onAddUser()">
      <span class="add-icon">
        <i class="pi pi-plus"></i>
      </span>
      <span class="add-text">Add User</span>
    </button>
  </div>

  <p-table [value]="users()" [loading]="loading()" styleClass="p-datatable-sm">
    <ng-template pTemplate="header">
      <tr>
        <th>Handle</th>
        <th>Email</th>
        <th>Role</th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-user>
      <tr>
        <td>{{ user.userHandle }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
        <td>
          <button
            pButton
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            (click)="onDeleteUser($event, user.id)"
          ></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4">No users yet</td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog
    header="Add User"
    [(visible)]="showAddDialog"
    [modal]="true"
    [style]="{ width: '28rem' }"
  >
    <div class="add-user-field">
      <label for="userHandle">User handle</label>
      <input
        pInputText
        id="userHandle"
        [(ngModel)]="newUser.userHandle"
        class="w-full form-input"
      />
    </div>
    <div class="add-user-field">
      <label for="email">Email</label>
      <input pInputText id="email" [(ngModel)]="newUser.email" class="w-full form-input" />
    </div>
    <div class="add-user-field">
      <label for="password">Password</label>
      <p-password
        id="password"
        [(ngModel)]="newUser.password"
        [toggleMask]="true"
        [feedback]="false"
        styleClass="w-full"
        inputStyleClass="w-full"
      />
    </div>
    <div class="add-user-field">
      <label for="role">Role</label>
      <p-select
        id="role"
        [options]="roles"
        [(ngModel)]="newUser.role"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full"
      />
    </div>
    <div class="add-user-actions">
      <button
        pButton
        label="Cancel"
        severity="secondary"
        [outlined]="true"
        styleClass="cancel-btn"
        (click)="onCancelAddUser()"
      ></button>
      <button pButton label="Add" styleClass="save-btn" (click)="onConfirmAddUser()"></button>
    </div>
  </p-dialog>
</div>
