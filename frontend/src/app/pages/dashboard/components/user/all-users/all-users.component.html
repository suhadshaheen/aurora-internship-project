<div class="users-page">
  <p-confirmdialog />

  <div class="users-page__header">
    <h2>All Users</h2>
    <button type="button" class="add-user-trigger" (click)="onAddUser()">
      <span class="add-icon">
        <i class="pi pi-plus"></i>
      </span>
      <span class="add-text">Add User</span>
    </button>
  </div>

  <div class="users-list">
    @for (user of users(); track user.id) {
      <article class="user-item">
        <div class="user-icon">
          <i class="pi pi-user"></i>
        </div>

        <div class="user-main">
          <div class="user-top">
            <div class="user-body">
              <h3>{{ user.userHandle }}</h3>
              <p class="user-email">{{ user.email }}</p>
            </div>

            <div class="user-top-actions">
              <p-tag [value]="user.role" severity="info"></p-tag>
              <button
                pButton
                icon="pi pi-trash"
                severity="danger"
                [text]="true"
                (click)="onDeleteUser($event, user.id)"
              ></button>
            </div>
          </div>
        </div>
      </article>
    } @empty {
      <p class="empty-text">No users yet</p>
    }
  </div>

  <p-dialog
    header="Add User"
    [(visible)]="showAddDialog"
    [modal]="true"
    [style]="{ width: '28rem' }"
  >
    <div class="add-user-field">
      <label for="userHandle">User handle</label>
      <input
        pInputText
        id="userHandle"
        [(ngModel)]="newUser.userHandle"
        class="w-full form-input"
      />
    </div>
    <div class="add-user-field">
      <label for="email">Email</label>
      <input pInputText id="email" [(ngModel)]="newUser.email" class="w-full form-input" />
    </div>
    <div class="add-user-field">
      <label for="password">Password</label>
      <p-password
        id="password"
        [(ngModel)]="newUser.password"
        [toggleMask]="true"
        [feedback]="false"
        styleClass="w-full"
        inputStyleClass="w-full"
      />
    </div>
    <div class="add-user-field">
      <label for="role">Role</label>
      <p-select
        id="role"
        [options]="roles"
        [(ngModel)]="newUser.role"
        optionLabel="label"
        optionValue="value"
        styleClass="w-full"
        appendTo="body"
      />
    </div>
    <div class="add-user-actions">
      <button
        pButton
        label="Cancel"
        severity="secondary"
        [outlined]="true"
        styleClass="cancel-btn"
        (click)="onCancelAddUser()"
      ></button>
      <button pButton label="Add" styleClass="save-btn" (click)="onConfirmAddUser()"></button>
    </div>
  </p-dialog>
</div>
